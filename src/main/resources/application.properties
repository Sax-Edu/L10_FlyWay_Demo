spring.application.name=pokemon-l10-flyway-demo

# Spring Boot läser samma lokala .env.example-fil som Docker Compose.
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL / DataSource
spring.datasource.url=jdbc:postgresql://localhost:5435/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway äger schemaändringarna.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Hibernate kontrollerar mappningen men ändrar inte databasschemat.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Vi kör en konsoldemo, ingen webbserver.
spring.main.web-application-type=none
spring.main.banner-mode=off

# Håll konsolen läsbar. Flyway-info visas så att migreringen går att följa.
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework=WARN
logging.level.org.flywaydb.core=INFO
